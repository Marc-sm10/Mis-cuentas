<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Cuentas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
  </style>
</head>
<body class="pb-12">

  <!-- ENCABEZADO Y TOTALES PRINCIPALES (Solo visible en la lista general) -->
  <header id="main-header" class="bg-indigo-700 text-white pt-6 pb-8 px-4 rounded-b-2xl shadow-lg">
    <div class="max-w-4xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Mis Cuentas</h1>
          <p class="text-indigo-200 text-xs mt-1">Gestión y control financiero</p>
        </div>
        <div class="flex gap-2">
          <button onclick="exportarBackupJSON()" title="Exportar Respaldo JSON" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
            <i class="fa-solid fa-download"></i> Respaldar
          </button>
          <label title="Importar Respaldo JSON" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 cursor-pointer transition">
            <i class="fa-solid fa-upload"></i> Restaurar
            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importarBackupJSON(event)">
          </label>
        </div>
      </div>

      <!-- Tarjetas de Totales Dinámicas -->
      <div id="totales-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <!-- Se generan dinámicamente según las categorías de total -->
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- VISTA 1: LISTA DE CUENTAS -->
    <section id="vista-lista-cuentas">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-800">Cuentas Registradas</h2>
        <button onclick="abrirModalCrearCuenta()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-md transition">
          <i class="fa-solid fa-plus"></i> Nueva Cuenta
        </button>
      </div>

      <div id="contenedor-cuentas" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Cuentas renderizadas aquí -->
      </div>
    </section>

    <!-- VISTA 2: DETALLE DE UNA CUENTA -->
    <section id="vista-detalle-cuenta" class="hidden">
      <!-- Botón de regreso -->
      <div class="mb-4 flex justify-between items-center">
        <button onclick="volverAListaCuentas()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
          <i class="fa-solid fa-arrow-left"></i> Volver a Cuentas
        </button>
        <div class="flex gap-2">
          <button id="btn-editar-cuenta-actual" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
            <i class="fa-solid fa-pen"></i> Editar
          </button>
          <button id="btn-eliminar-cuenta-actual" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
            <i class="fa-solid fa-trash"></i> Eliminar
          </button>
        </div>
      </div>

      <!-- Ficha de la Cuenta -->
      <div id="info-cuenta-detalle" class="bg-white rounded-2xl p-5 card-shadow mb-6">
        <!-- Se renderiza aisladamente la info de esta cuenta única -->
      </div>

      <!-- Sección de Débitos / Movimientos -->
      <div class="bg-white rounded-2xl p-5 card-shadow">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
          <h3 class="text-md font-bold text-gray-800">Registro de Movimientos</h3>
          <button onclick="abrirModalNuevoDebito()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow transition">
            <i class="fa-solid fa-plus"></i> Registrar Débito
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-semibold">
              <tr>
                <th class="py-2.5 px-3">Fecha</th>
                <th class="py-2.5 px-3">Descripción</th>
                <th class="py-2.5 px-3">N° Recibo / Ref</th>
                <th class="py-2.5 px-3 text-right">Monto</th>
                <th class="py-2.5 px-3 text-center">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-debitos-body" class="divide-y divide-gray-100">
              <!-- Filas de débitos -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: CREAR / EDITAR CUENTA -->
  <div id="modal-cuenta" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 id="modal-cuenta-titulo" class="text-lg font-bold text-gray-800 mb-4">Nueva Cuenta</h3>
      
      <form id="form-cuenta" onsubmit="guardarCuenta(event)" class="space-y-4">
        <input type="hidden" id="cuenta-id">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre de la Cuenta *</label>
          <input type="text" id="cuenta-nombre" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Presupuesto / Saldo Inicial *</label>
          <input type="number" step="0.01" min="0" id="cuenta-presupuesto" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pertenecer a Total:</label>
          <select id="cuenta-tipo-total" onchange="evaluarOpcionTotal()" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="GENERAL">Total General</option>
            <option value="NINGUNO">No sumar a ningún total (Independiente)</option>
            <option value="NUEVO">+ Crear nuevo total personalizado...</option>
          </select>
        </div>

        <!-- Campo condicional para nombre de total personalizado -->
        <div id="div-nuevo-total" class="hidden">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Total Personalizado *</label>
          <input type="text" id="cuenta-nuevo-total-nombre" placeholder="Ej: Efectivo Personal, Proyecto X" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Notas / Descripción (Opcional)</label>
          <textarea id="cuenta-notas" rows="2" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="cerrarModalCuenta()" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Guardar Cuenta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR DÉBITO -->
  <div id="modal-debito" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Registrar Débito</h3>
      
      <form id="form-debito" onsubmit="guardarDebito(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Monto *</label>
          <input type="number" step="0.01" min="0.01" id="debito-monto" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción *</label>
          <input type="text" id="debito-descripcion" required placeholder="Ej: Compra de insumos, pago de servicio" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Fecha *</label>
            <input type="date" id="debito-fecha" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">N° Recibo / Ref</label>
            <input type="text" id="debito-recibo" placeholder="Opcional" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="cerrarModalDebito()" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT LOGICA APLICACIÓN -->
  <script>
    let appData = {
      cuentas: []
    };

    let idCuentaSeleccionada = null;

    // Cargar datos al iniciar
    document.addEventListener('DOMContentLoaded', () => {
      cargarLocalStorage();
      renderizarTotales();
      renderizarListaCuentas();
    });

    function cargarLocalStorage() {
      const datosGuardados = localStorage.getItem('app_cuentas_data');
      if (datosGuardados) {
        try {
          appData = JSON.parse(datosGuardados);
        } catch (e) {
          console.error("Error al leer LocalStorage", e);
        }
      }
    }

    function guardarLocalStorage() {
      localStorage.setItem('app_cuentas_data', JSON.stringify(appData));
    }

    // --- MANEJO DE TOTALES EN ENCABEZADO ---
    function renderizarTotales() {
      const contenedor = document.getElementById('totales-container');
      contenedor.innerHTML = '';

      // Agrupar cuentas por su tipo de total
      const totalesAgrupados = {};

      appData.cuentas.forEach(cuenta => {
        const grupo = cuenta.grupoTotal || 'GENERAL';
        if (grupo !== 'NINGUNO') {
          if (!totalesAgrupados[grupo]) {
            totalesAgrupados[grupo] = 0;
          }
          const totalDebitos = (cuenta.debitos || []).reduce((acc, d) => acc + parseFloat(d.monto || 0), 0);
          const saldoActual = parseFloat(cuenta.presupuesto || 0) - totalDebitos;
          totalesAgrupados[grupo] += saldoActual;
        }
      });

      // Si no hay general creado aún, mostrar tarjeta por defecto en 0
      if (!('GENERAL' in totalesAgrupados)) {
        totalesAgrupados['GENERAL'] = 0;
      }

      // Generar tarjetas
      Object.keys(totalesAgrupados).forEach(grupo => {
        const monto = totalesAgrupados[grupo];
        const esGeneral = grupo === 'GENERAL';
        const tituloCard = esGeneral ? 'Total General' : grupo;

        const cardHTML = `
          <div class="${esGeneral ? 'bg-white/20 border border-white/30' : 'bg-indigo-800/60 border border-indigo-500/30'} backdrop-blur-sm p-4 rounded-xl text-white">
            <p class="text-xs uppercase font-medium tracking-wider text-indigo-100">${tituloCard}</p>
            <p class="text-2xl font-black mt-1">Q ${monto.toFixed(2)}</p>
          </div>
        `;
        contenedor.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    // --- VISTA LISTA DE CUENTAS ---
    function renderizarListaCuentas() {
      const contenedor = document.getElementById('contenedor-cuentas');
      contenedor.innerHTML = '';

      if (appData.cuentas.length === 0) {
        contenedor.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl p-8 text-center text-gray-500 border border-dashed border-gray-300">
            <i class="fa-solid fa-wallet text-3xl mb-2 text-gray-300"></i>
            <p class="text-sm">No tienes cuentas registradas aún.</p>
            <button onclick="abrirModalCrearCuenta()" class="mt-3 text-xs text-indigo-600 font-semibold hover:underline">Crear primera cuenta</button>
          </div>
        `;
        return;
      }

      appData.cuentas.forEach(cuenta => {
        const totalDebitos = (cuenta.debitos || []).reduce((acc, d) => acc + parseFloat(d.monto || 0), 0);
        const saldoDisponible = parseFloat(cuenta.presupuesto || 0) - totalDebitos;
        
        let etiquetaTotal = '';
        if (cuenta.grupoTotal === 'NINGUNO') {
          etiquetaTotal = `<span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full font-medium">Sin sumar</span>`;
        } else if (cuenta.grupoTotal && cuenta.grupoTotal !== 'GENERAL') {
          etiquetaTotal = `<span class="bg-indigo-50 text-indigo-700 text-[10px] px-2 py-0.5 rounded-full font-medium">${cuenta.grupoTotal}</span>`;
        }

        const cardHTML = `
          <div onclick="verDetalleCuenta('${cuenta.id}')" class="bg-white rounded-2xl p-5 card-shadow hover:shadow-md transition cursor-pointer border border-transparent hover:border-indigo-100">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h3 class="font-bold text-gray-800 text-base">${cuenta.nombre}</h3>
                ${etiquetaTotal}
              </div>
              <span class="text-xs font-semibold px-2 py-1 bg-emerald-50 text-emerald-700 rounded-lg">
                Saldo: Q ${saldoDisponible.toFixed(2)}
              </span>
            </div>
            
            <div class="text-xs text-gray-500 space-y-1 mt-3 pt-3 border-t border-gray-100">
              <div class="flex justify-between">
                <span>Presupuesto Inicial:</span>
                <span class="font-medium text-gray-700">Q ${parseFloat(cuenta.presupuesto).toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Total Débitos:</span>
                <span class="font-medium text-rose-600">Q ${totalDebitos.toFixed(2)}</span>
              </div>
            </div>
          </div>
        `;
        contenedor.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    // --- NAVEGACIÓN Y VISTA AISLADA DE DETALLE ---
    function verDetalleCuenta(id) {
      idCuentaSeleccionada = id;
      document.getElementById('vista-lista-cuentas').classList.add('hidden');
      document.getElementById('main-header').classList.add('hidden'); // Oculta totales generales
      document.getElementById('vista-detalle-cuenta').classList.remove('hidden');

      renderizarDetalleCuentaActual();
    }

    function volverAListaCuentas() {
      idCuentaSeleccionada = null;
      document.getElementById('vista-detalle-cuenta').classList.add('hidden');
      document.getElementById('main-header').classList.remove('hidden'); // Muestra totales
      document.getElementById('vista-lista-cuentas').classList.remove('hidden');

      renderizarTotales();
      renderizarListaCuentas();
    }

    function renderizarDetalleCuentaActual() {
      const cuenta = appData.cuentas.find(c => c.id === idCuentaSeleccionada);
      if (!cuenta) return volverAListaCuentas();

      const totalDebitos = (cuenta.debitos || []).reduce((acc, d) => acc + parseFloat(d.monto || 0), 0);
      const saldoDisponible = parseFloat(cuenta.presupuesto || 0) - totalDebitos;

      // Configurar botones de editar/eliminar
      document.getElementById('btn-editar-cuenta-actual').onclick = () => abrirModalEditarCuenta(cuenta.id);
      document.getElementById('btn-eliminar-cuenta-actual').onclick = () => eliminarCuenta(cuenta.id);

      // Renderizar Ficha
      let etiquetaTotalText = "Total General";
      if (cuenta.grupoTotal === 'NINGUNO') etiquetaTotalText = "Independiente (Sin sumar a totales)";
      else if (cuenta.grupoTotal && cuenta.grupoTotal !== 'GENERAL') etiquetaTotalText = `Grupo: ${cuenta.grupoTotal}`;

      document.getElementById('info-cuenta-detalle').innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <div>
            <h2 class="text-xl font-bold text-gray-800">${cuenta.nombre}</h2>
            <p class="text-xs text-indigo-600 font-medium">${etiquetaTotalText}</p>
          </div>
          <div class="text-right">
            <span class="text-xs text-gray-500 block">Saldo Actual</span>
            <span class="text-2xl font-black ${saldoDisponible < 0 ? 'text-rose-600' : 'text-emerald-600'}">
              Q ${saldoDisponible.toFixed(2)}
            </span>
          </div>
        </div>
        ${cuenta.notas ? `<p class="text-xs text-gray-600 italic bg-gray-50 p-2.5 rounded-lg mb-3">${cuenta.notas}</p>` : ''}
        <div class="grid grid-cols-2 gap-4 text-xs pt-3 border-t border-gray-100">
          <div>
            <span class="text-gray-500">Presupuesto Inicial:</span>
            <p class="font-bold text-gray-800 text-sm">Q ${parseFloat(cuenta.presupuesto).toFixed(2)}</p>
          </div>
          <div>
            <span class="text-gray-500">Total Gastado:</span>
            <p class="font-bold text-rose-600 text-sm">Q ${totalDebitos.toFixed(2)}</p>
          </div>
        </div>
      `;

      // Renderizar Tabla de Débitos
      const tbody = document.getElementById('tabla-debitos-body');
      tbody.innerHTML = '';

      if (!cuenta.debitos || cuenta.debitos.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-6 text-center text-gray-400 text-xs">No hay débitos registrados en esta cuenta.</td>
          </tr>
        `;
        return;
      }

      cuenta.debitos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).forEach((debito, index) => {
        const filaHTML = `
          <tr class="hover:bg-gray-50 transition">
            <td class="py-2.5 px-3 text-gray-600 text-xs">${debito.fecha}</td>
            <td class="py-2.5 px-3 text-gray-800 font-medium">${debito.descripcion}</td>
            <td class="py-2.5 px-3 text-gray-500 text-xs">${debito.recibo || '-'}</td>
            <td class="py-2.5 px-3 text-right font-bold text-rose-600">Q ${parseFloat(debito.monto).toFixed(2)}</td>
            <td class="py-2.5 px-3 text-center">
              <button onclick="eliminarDebito(${index})" class="text-gray-400 hover:text-rose-600 transition">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', filaHTML);
      });
    }

    // --- MODALES CUENTA ---
    function abrirModalCrearCuenta() {
      document.getElementById('modal-cuenta-titulo').innerText = 'Nueva Cuenta';
      document.getElementById('cuenta-id').value = '';
      document.getElementById('cuenta-nombre').value = '';
      document.getElementById('cuenta-presupuesto').value = '';
      document.getElementById('cuenta-notas').value = '';
      
      actualizarOpcionesSelectTotales('GENERAL');
      document.getElementById('modal-cuenta').classList.remove('hidden');
      document.getElementById('modal-cuenta').classList.add('flex');
    }

    function abrirModalEditarCuenta(id) {
      const cuenta = appData.cuentas.find(c => c.id === id);
      if (!cuenta) return;

      document.getElementById('modal-cuenta-titulo').innerText = 'Editar Cuenta';
      document.getElementById('cuenta-id').value = cuenta.id;
      document.getElementById('cuenta-nombre').value = cuenta.nombre;
      document.getElementById('cuenta-presupuesto').value = cuenta.presupuesto;
      document.getElementById('cuenta-notas').value = cuenta.notas || '';

      actualizarOpcionesSelectTotales(cuenta.grupoTotal || 'GENERAL');
      document.getElementById('modal-cuenta').classList.remove('hidden');
      document.getElementById('modal-cuenta').classList.add('flex');
    }

    function actualizarOpcionesSelectTotales(valorSeleccionado) {
      const select = document.getElementById('cuenta-tipo-total');
      select.innerHTML = `
        <option value="GENERAL">Total General</option>
        <option value="NINGUNO">No sumar a ningún total (Independiente)</option>
      `;

      // Recopilar totales personalizados existentes
      const gruposExistentes = new Set();
      appData.cuentas.forEach(c => {
        if (c.grupoTotal && c.grupoTotal !== 'GENERAL' && c.grupoTotal !== 'NINGUNO') {
          gruposExistentes.add(c.grupoTotal);
        }
      });

      gruposExistentes.forEach(grupo => {
        select.innerHTML += `<option value="${grupo}">${grupo}</option>`;
      });

      select.innerHTML += `<option value="NUEVO">+ Crear nuevo total personalizado...</option>`;
      select.value = valorSeleccionado;
      evaluarOpcionTotal();
    }

    function evaluarOpcionTotal() {
      const val = document.getElementById('cuenta-tipo-total').value;
      const divNuevo = document.getElementById('div-nuevo-total');
      if (val === 'NUEVO') {
        divNuevo.classList.remove('hidden');
        document.getElementById('cuenta-nuevo-total-nombre').required = true;
      } else {
        divNuevo.classList.add('hidden');
        document.getElementById('cuenta-nuevo-total-nombre').required = false;
      }
    }

    function cerrarModalCuenta() {
      document.getElementById('modal-cuenta').classList.add('hidden');
      document.getElementById('modal-cuenta').classList.remove('flex');
    }

    function guardarCuenta(e) {
      e.preventDefault();
      const id = document.getElementById('cuenta-id').value;
      const nombre = document.getElementById('cuenta-nombre').value.trim();
      const presupuesto = parseFloat(document.getElementById('cuenta-presupuesto').value);
      const notas = document.getElementById('cuenta-notas').value.trim();

      let grupoTotal = document.getElementById('cuenta-tipo-total').value;
      if (grupoTotal === 'NUEVO') {
        grupoTotal = document.getElementById('cuenta-nuevo-total-nombre').value.trim().toUpperCase();
      }

      if (id) {
        // Editar
        const cuenta = appData.cuentas.find(c => c.id === id);
        if (cuenta) {
          cuenta.nombre = nombre;
          cuenta.presupuesto = presupuesto;
          cuenta.notas = notas;
          cuenta.grupoTotal = grupoTotal;
        }
      } else {
        // Crear
        const nuevaCuenta = {
          id: 'c_' + Date.now(),
          nombre,
          presupuesto,
          notas,
          grupoTotal,
          debitos: []
        };
        appData.cuentas.push(nuevaCuenta);
      }

      guardarLocalStorage();
      cerrarModalCuenta();

      if (idCuentaSeleccionada) {
        renderizarDetalleCuentaActual();
      } else {
        renderizarTotales();
        renderizarListaCuentas();
      }
    }

    function eliminarCuenta(id) {
      if (confirm('¿Estás seguro de eliminar esta cuenta? Se borrarán todos sus registros.')) {
        appData.cuentas = appData.cuentas.filter(c => c.id !== id);
        guardarLocalStorage();
        volverAListaCuentas();
      }
    }

    // --- MODALES DÉBITOS ---
    function abrirModalNuevoDebito() {
      document.getElementById('debito-monto').value = '';
      document.getElementById('debito-descripcion').value = '';
      document.getElementById('debito-recibo').value = '';
      document.getElementById('debito-fecha').value = new Date().toISOString().split('T')[0];

      document.getElementById('modal-debito').classList.remove('hidden');
      document.getElementById('modal-debito').classList.add('flex');
    }

    function cerrarModalDebito() {
      document.getElementById('modal-debito').classList.add('hidden');
      document.getElementById('modal-debito').classList.remove('flex');
    }

    function guardarDebito(e) {
      e.preventDefault();
      const cuenta = appData.cuentas.find(c => c.id === idCuentaSeleccionada);
      if (!cuenta) return;

      const nuevoDebito = {
        monto: parseFloat(document.getElementById('debito-monto').value),
        descripcion: document.getElementById('debito-descripcion').value.trim(),
        fecha: document.getElementById('debito-fecha').value,
        recibo: document.getElementById('debito-recibo').value.trim()
      };

      if (!cuenta.debitos) cuenta.debitos = [];
      cuenta.debitos.push(nuevoDebito);

      guardarLocalStorage();
      cerrarModalDebito();
      renderizarDetalleCuentaActual();
    }

    function eliminarDebito(index) {
      const cuenta = appData.cuentas.find(c => c.id === idCuentaSeleccionada);
      if (!cuenta) return;

      if (confirm('¿Borrar este movimiento?')) {
        cuenta.debitos.splice(index, 1);
        guardarLocalStorage();
        renderizarDetalleCuentaActual();
      }
    }

    // --- RESPALDO JSON ---
    function exportarBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `respaldo_cuentas_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarBackupJSON(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const parsedData = JSON.parse(e.target.result);
          if (parsedData && Array.isArray(parsedData.cuentas)) {
            appData = parsedData;
            guardarLocalStorage();
            renderizarTotales();
            renderizarListaCuentas();
            alert('¡Respaldo cargado con éxito!');
          } else {
            alert('El archivo no tiene el formato correcto.');
          }
        } catch (err) {
          alert('Error al leer el archivo JSON.');
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }
  </script>
</body>
